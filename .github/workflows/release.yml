name: Build & Publish to Stores

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma para build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  # ─── Build & Submit Android ────────────────────────────────
  build-android:
    name: Build & Submit Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.platform != 'ios' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Google Service Account
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' | base64 --decode > google-service-account.json

      - name: Build Android locally
        run: eas build --platform android --profile production --local --non-interactive --output ./Compranomia.aab

      - name: Submit to Google Play
        run: eas submit --platform android --profile production --non-interactive --path ./Compranomia.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compranomia-Android
          path: ./Compranomia.aab

  # ─── Build & Submit iOS ────────────────────────────────────
  build-ios:
    name: Build & Submit iOS
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.platform != 'android' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS locally
        run: eas build --platform ios --profile production --local --non-interactive --output ./Compranomia.ipa

      - name: Submit to App Store
        run: eas submit --platform ios --profile production --non-interactive --path ./Compranomia.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compranomia-iOS
          path: ./Compranomia.ipa
